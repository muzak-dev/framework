name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first: the older run's result is
# about code nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain line in go.mod is what pins the version; this only has to
      # be new enough to honour it.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      # The race detector is the one that matters here: request-scoped state,
      # the dependency container and the connection registries are all shared
      # across goroutines by design.
      - name: Test under the race detector
        run: go test ./... -race -count=1

      # The README carries a coverage number and a badge. This is what stops
      # either of them from quietly becoming a lie.
      - name: Coverage
        env:
          MINIMUM: '98.0'
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "total coverage: ${total}% (minimum ${MINIMUM}%)"
          echo "### Coverage: ${total}%" >> "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" -v m="$MINIMUM" 'BEGIN { exit !(t + 0 < m + 0) }' \
            && { echo "::error::coverage ${total}% is below the ${MINIMUM}% minimum"; exit 1; } \
            || echo "coverage gate passed"

      - name: Build the example
        working-directory: example
        run: |
          go build ./...
          go vet ./...

  # The Linux job never runs the code that only Windows reaches: a frontend
  # treating a backslash as a separator and refusing 8.3 short names, os.Root
  # on NTFS, a file that cannot be removed while it is open, a network stack
  # that resets a connection where Linux closes it, and a coarser timer under
  # every deadline. This job is the only place any of that is exercised.
  #
  # A separate job rather than a matrix over the one above, so the check named
  # "test" keeps its name and a branch protection rule requiring it still
  # matches. Coverage is gated on Linux alone: the number is a property of the
  # code, and a second gate would only disagree with the first about which
  # platform-specific branch counts.
  test-windows:
    name: test (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Git on the hosted Windows image rewrites line endings on checkout. A
      # module fetched through the proxy keeps the bytes as committed, so that
      # is what the tests should read; the YAML parser's CRLF handling is
      # covered by a test of its own rather than by this accident.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      # The race detector needs cgo on Windows, which the hosted image's MinGW
      # gcc provides.
      - name: Test under the race detector
        run: go test ./... -race -count=1

      - name: Build the example
        working-directory: example
        run: |
          go build ./...
          go vet ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Installed directly rather than through golangci-lint-action, which
      # resolves its own version and got this wrong twice: a release binary
      # built with Go 1.24 refuses to analyse a module targeting 1.27, and
      # `latest` resolves to v1, whose schema rejects this repository's v2
      # config. Pinning the version that developers run locally and building it
      # with the toolchain above leaves nothing to resolve.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1

      - name: Lint
        run: golangci-lint run --timeout=5m
